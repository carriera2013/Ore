<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ore">
<title>Ore Lavorate</title>
<style>
  :root {
    --bg: #f7f7f5;
    --surface: #ffffff;
    --border: #e2e2de;
    --text: #1a1a18;
    --muted: #8a8a84;
    --accent: #2563eb;
    --accent-light: #eff4ff;
    --success: #16a34a;
    --success-light: #f0fdf4;
    --danger: #dc2626;
    --radius: 12px;
    --font: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 18px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .app-title {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .month-nav button {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 20px;
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
    line-height: 1;
  }

  .month-nav button:active { background: var(--accent-light); }

  .month-label {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    min-width: 160px;
    text-align: center;
  }

  /* TOTALE HEADER */
  .totale-bar {
    display: flex;
    gap: 16px;
    margin-top: 10px;
  }

  .stat {
    display: flex;
    flex-direction: column;
  }

  .stat-val {
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .stat-divider {
    width: 1px;
    background: var(--border);
    margin: 2px 0;
  }

  /* INPUT RAPIDO */
  .input-card {
    margin: 16px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 16px;
  }

  .input-card-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .date-display {
    font-size: 14px;
    color: var(--text);
    font-weight: 500;
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    min-width: 0;
    -webkit-appearance: none;
    appearance: none;
  }
  .date-display:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .ore-input {
    width: 80px;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 9px 8px;
    background: var(--bg);
    color: var(--text);
    -webkit-appearance: none;
    flex-shrink: 0;
  }

  .ore-input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .btn-salva {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s;
  }

  .btn-salva:active { opacity: 0.75; }

  /* PRESET ORE */
  .preset-row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }

  .preset-btn {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    transition: all 0.1s;
  }

  .preset-btn:active,
  .preset-btn.selected {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  .preset-btn.riposo {
    color: var(--muted);
  }
  .preset-btn.riposo.selected {
    background: #f3f4f6;
    border-color: var(--muted);
    color: var(--muted);
  }

  /* TOAST */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-80px);
    background: var(--text);
    color: white;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }

  .toast.show { transform: translateX(-50%) translateY(0); }

  /* LISTA GIORNI */
  .section-label {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
    padding: 0 20px;
    margin-bottom: 8px;
  }

  .giorni-list {
    margin: 0 16px 80px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .giorno-row {
    display: flex;
    align-items: center;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }

  .giorno-row:last-child { border-bottom: none; }

  .giorno-row.oggi {
    background: var(--accent-light);
  }

  .giorno-row.riposo-row {
    opacity: 0.5;
  }

  .giorno-data {
    flex: 1;
    min-width: 0;
  }

  .giorno-nome {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .giorno-full {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
  }

  .giorno-ore {
    font-size: 17px;
    font-weight: 700;
    color: var(--accent);
    min-width: 48px;
    text-align: right;
  }

  .giorno-ore.riposo-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }

  .btn-delete {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    line-height: 1;
    flex-shrink: 0;
  }

  .btn-delete:active { color: var(--danger); background: #fef2f2; }

  /* VUOTO */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }

  .empty-state .icon { font-size: 36px; margin-bottom: 10px; }
  .empty-state p { font-size: 14px; }

  /* BOTTOM NAV */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0; right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 10px 20px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    gap: 10px;
    z-index: 10;
  }

  .btn-export {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    text-align: center;
  }

  .btn-export:active { background: var(--border); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.75; }
  }
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <span class="app-title">Ore Lavorate</span>
  </div>
  <div class="month-nav">
    <button onclick="cambioMese(-1)">‹</button>
    <span class="month-label" id="labelMese"></span>
    <button onclick="cambioMese(1)">›</button>
  </div>
  <div class="totale-bar">
    <div class="stat">
      <span class="stat-val" id="totOre">0h</span>
      <span class="stat-label">Totale mese</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-val" id="totGiorni">0</span>
      <span class="stat-label">Giorni lavorati</span>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <span class="stat-val" id="mediaOre">-</span>
      <span class="stat-label">Media/giorno</span>
    </div>
  </div>
</div>

<!-- INPUT RAPIDO -->
<div class="input-card">
  <div class="input-card-label">Inserisci ore</div>
  <div class="input-row">
    <input type="date" class="date-display" id="dataOggi">
    <input type="number" class="ore-input" id="oreInput" min="0" max="24" step="0.5" placeholder="h" inputmode="decimal">
    <button class="btn-salva" onclick="salvaOre()">Salva</button>
  </div>
  <div class="preset-row">
    <button class="preset-btn" onclick="setPreset(8)">8h</button>
    <button class="preset-btn" onclick="setPreset(7)">7h</button>
    <button class="preset-btn" onclick="setPreset(6)">6h</button>
    <button class="preset-btn" onclick="setPreset(4)">4h</button>
    <button class="preset-btn riposo" onclick="setPreset(0)">Riposo</button>
  </div>
</div>

<!-- LISTA -->
<div class="section-label" id="labelLista"></div>
<div class="giorni-list" id="giorniList"></div>

<!-- BOTTOM BAR -->
<div class="bottom-bar">
  <button class="btn-export" onclick="esportaCSV()">📤 Esporta CSV</button>
  <button class="btn-export" onclick="esportaTesto()">📋 Copia riepilogo</button>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────
const MESI_IT = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno',
                 'Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GIORNI_IT = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const GIORNI_SHORT = ['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];

let oggi = new Date();
let meseVista = { anno: oggi.getFullYear(), mese: oggi.getMonth() };

function chiaveStorage(anno, mese) {
  return 'ore_' + anno + '_' + String(mese + 1).padStart(2, '0');
}

function caricaMese(anno, mese) {
  try {
    return JSON.parse(localStorage.getItem(chiaveStorage(anno, mese))) || {};
  } catch(e) { return {}; }
}

function salvaMese(anno, mese, dati) {
  localStorage.setItem(chiaveStorage(anno, mese), JSON.stringify(dati));
}

// ── INIT ──────────────────────────────────────────────────────────
function init() {
  aggiornaDataOggi();
  render();
  leggiParametroURL();
}

function leggiParametroURL() {
  const params = new URLSearchParams(window.location.search);
  const ore = params.get('ore');
  if (ore === null) return;

  const val = parseFloat(ore);
  if (isNaN(val) || val < 0 || val > 24) return;

  // Pre-popola il campo
  const input = document.getElementById('oreInput');
  input.value = val;

  // Evidenzia il preset corrispondente se esiste
  document.querySelectorAll('.preset-btn').forEach(b => {
    if (parseFloat(b.textContent) === val) b.classList.add('selected');
  });

  // Mostra banner Siri
  const card = document.querySelector('.input-card');
  const banner = document.createElement('div');
  banner.id = 'siri-banner';
  banner.innerHTML = '🎙️ Siri ha inserito <strong>' + (val === 0 ? 'Riposo' : formatOre(val)) + '</strong> — tocca <strong>Salva</strong> per confermare';
  banner.style.cssText = [
    'background:var(--accent)',
    'color:white',
    'border-radius:8px',
    'padding:10px 14px',
    'font-size:13px',
    'margin-top:10px',
    'line-height:1.4',
    'animation:pulse 1.2s ease-in-out 3'
  ].join(';');
  card.appendChild(banner);

  // Scroll all'input
  setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 200);

  // Rimuove il parametro dall'URL senza ricaricare la pagina
  const url = new URL(window.location.href);
  url.searchParams.delete('ore');
  history.replaceState({}, '', url.toString());
}

function aggiornaDataOggi() {
  const d = new Date();
  const key = dataKey(d);
  document.getElementById('dataOggi').value = key;
}

// ── NAVIGAZIONE MESE ──────────────────────────────────────────────
function cambioMese(delta) {
  let m = meseVista.mese + delta;
  let a = meseVista.anno;
  if (m > 11) { m = 0; a++; }
  if (m < 0)  { m = 11; a--; }
  meseVista = { anno: a, mese: m };
  render();
}

// ── RENDER ────────────────────────────────────────────────────────
function render() {
  const { anno, mese } = meseVista;
  const dati = caricaMese(anno, mese);

  // Header mese
  document.getElementById('labelMese').textContent = MESI_IT[mese] + ' ' + anno;
  document.getElementById('labelLista').textContent = MESI_IT[mese] + ' ' + anno;

  // Statistiche
  const valori = Object.values(dati).filter(v => v > 0);
  const totale = valori.reduce((s, v) => s + v, 0);
  const giorni = valori.length;
  document.getElementById('totOre').textContent = formatOre(totale);
  document.getElementById('totGiorni').textContent = giorni;
  document.getElementById('mediaOre').textContent = giorni > 0 ? formatOre(totale / giorni) : '-';

  // Lista giorni
  const list = document.getElementById('giorniList');
  const chiavi = Object.keys(dati).sort().reverse();

  if (chiavi.length === 0) {
    list.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>Nessuna voce per questo mese</p></div>';
    return;
  }

  const oggiStr = dataKey(new Date());
  list.innerHTML = chiavi.map(key => {
    const ore = dati[key];
    const [a, m2, g] = key.split('-').map(Number);
    const d = new Date(a, m2 - 1, g);
    const nomeG = GIORNI_SHORT[d.getDay()];
    const isOggi = key === oggiStr;
    const isRiposo = ore === 0;

    return '<div class="giorno-row' + (isOggi ? ' oggi' : '') + (isRiposo ? ' riposo-row' : '') + '">' +
      '<div class="giorno-data">' +
        '<div class="giorno-nome">' + nomeG + ' ' + String(g).padStart(2, '0') + '/' + String(m2).padStart(2, '0') + (isOggi ? ' <span style="font-size:11px;color:var(--accent);">oggi</span>' : '') + '</div>' +
        '<div class="giorno-full">' + MESI_IT[m2 - 1] + ' ' + a + '</div>' +
      '</div>' +
      '<div class="giorno-ore' + (isRiposo ? ' riposo-label' : '') + '">' + (isRiposo ? 'riposo' : formatOre(ore)) + '</div>' +
      '<button class="btn-delete" onclick="eliminaGiorno(\'' + key + '\')" title="Elimina">×</button>' +
    '</div>';
  }).join('');
}

function formatOre(n) {
  if (n === Math.floor(n)) return n + 'h';
  return n.toFixed(1).replace('.', ',') + 'h';
}

function dataKey(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

// ── SALVATAGGIO ───────────────────────────────────────────────────
function salvaOre() {
  const input = document.getElementById('oreInput');
  const val = parseFloat(input.value);

  if (input.value === '' || isNaN(val) || val < 0 || val > 24) {
    mostraToast('Inserisci un valore tra 0 e 24');
    return;
  }

  const dateVal = document.getElementById('dataOggi').value;
  if (!dateVal) { mostraToast('Seleziona una data'); return; }
  const [anno, mese0, giorno] = dateVal.split('-').map(Number);
  const mese = mese0 - 1;
  const key = dateVal;
  const dati = caricaMese(anno, mese);
  dati[key] = val;
  salvaMese(anno, mese, dati);

  // Se siamo sul mese corrente, aggiorna vista
  if (meseVista.anno === anno && meseVista.mese === mese) {
    render();
  }

  input.value = '';
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
  const banner = document.getElementById('siri-banner');
  if (banner) banner.remove();
  aggiornaDataOggi();
  const label = dateVal === dataKey(new Date()) ? 'oggi' : dateVal.split('-').reverse().slice(0,2).join('/');
  mostraToast(val === 0 ? 'Riposo salvato (' + label + ')' : formatOre(val) + ' salvate per ' + label + ' ✓');
}

function setPreset(val) {
  document.getElementById('oreInput').value = val;
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('selected'));
  event.target.classList.add('selected');
}

function eliminaGiorno(key) {
  const [a, m, g] = key.split('-').map(Number);
  const dati = caricaMese(a, m - 1);
  const ore = dati[key];
  const label = ore === 0 ? 'riposo' : formatOre(ore);
  const dataLabel = String(g).padStart(2,'0') + '/' + String(m).padStart(2,'0');

  const existing = document.getElementById('confirm-dialog');
  if (existing) existing.remove();

  // Overlay
  const overlay = document.createElement('div');
  overlay.id = 'confirm-dialog';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding-bottom:env(safe-area-inset-bottom)';

  // Sheet
  const sheet = document.createElement('div');
  sheet.style.cssText = 'background:#fff;border-radius:16px 16px 0 0;padding:24px 20px;width:100%;max-width:480px';

  const titolo = document.createElement('div');
  titolo.style.cssText = 'font-size:16px;font-weight:700;margin-bottom:6px';
  titolo.textContent = 'Elimina voce';

  const sottotitolo = document.createElement('div');
  sottotitolo.style.cssText = 'font-size:14px;color:#8a8a84;margin-bottom:20px';
  sottotitolo.textContent = dataLabel + ' — ' + label;

  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:10px';

  const btnAnnulla = document.createElement('button');
  btnAnnulla.style.cssText = 'flex:1;padding:13px;border-radius:10px;border:1px solid #e2e2de;background:#f7f7f5;font-size:15px;font-weight:600;cursor:pointer';
  btnAnnulla.textContent = 'Annulla';
  btnAnnulla.onclick = function() { overlay.remove(); };

  const btnElimina = document.createElement('button');
  btnElimina.style.cssText = 'flex:1;padding:13px;border-radius:10px;border:none;background:#dc2626;color:white;font-size:15px;font-weight:600;cursor:pointer';
  btnElimina.textContent = 'Elimina';
  btnElimina.onclick = function() { confermaElimina(key); };

  btnRow.appendChild(btnAnnulla);
  btnRow.appendChild(btnElimina);
  sheet.appendChild(titolo);
  sheet.appendChild(sottotitolo);
  sheet.appendChild(btnRow);
  overlay.appendChild(sheet);
  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
}

function chiudiDialog() { const d = document.getElementById('confirm-dialog'); if(d) d.remove(); }

function confermaElimina(key) {
  document.getElementById('confirm-dialog').remove();
  const [a, m] = key.split('-').map(Number);
  const dati = caricaMese(a, m - 1);
  delete dati[key];
  salvaMese(a, m - 1, dati);
  render();
  mostraToast('Voce eliminata');
}

// ── EXPORT ────────────────────────────────────────────────────────
function esportaCSV() {
  const { anno, mese } = meseVista;
  const dati = caricaMese(anno, mese);
  const chiavi = Object.keys(dati).sort();

  if (chiavi.length === 0) {
    mostraToast('Nessun dato da esportare');
    return;
  }

  let csv = 'Data,Giorno,Ore\n';
  chiavi.forEach(key => {
    const [a, m2, g] = key.split('-').map(Number);
    const d = new Date(a, m2 - 1, g);
    const nomeG = GIORNI_IT[d.getDay()];
    csv += key + ',' + nomeG + ',' + dati[key] + '\n';
  });

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a2 = document.createElement('a');
  a2.href = url;
  a2.download = 'ore_' + MESI_IT[mese].toLowerCase() + '_' + anno + '.csv';
  a2.click();
  URL.revokeObjectURL(url);
  mostraToast('CSV scaricato');
}

function esportaTesto() {
  const { anno, mese } = meseVista;
  const dati = caricaMese(anno, mese);
  const chiavi = Object.keys(dati).sort();

  if (chiavi.length === 0) {
    mostraToast('Nessun dato da copiare');
    return;
  }

  const valori = Object.values(dati).filter(v => v > 0);
  const totale = valori.reduce((s, v) => s + v, 0);

  let testo = 'ORE LAVORATE — ' + MESI_IT[mese].toUpperCase() + ' ' + anno + '\n';
  testo += '─'.repeat(30) + '\n';

  chiavi.forEach(key => {
    const [a, m2, g] = key.split('-').map(Number);
    const d = new Date(a, m2 - 1, g);
    const nomeG = GIORNI_IT[d.getDay()];
    const ore = dati[key];
    testo += String(g).padStart(2,'0') + '/' + String(m2).padStart(2,'0') +
      '  ' + (nomeG.charAt(0).toUpperCase() + nomeG.slice(1)).padEnd(12) +
      (ore === 0 ? 'riposo' : formatOre(ore)) + '\n';
  });

  testo += '─'.repeat(30) + '\n';
  testo += 'TOTALE: ' + formatOre(totale) + '  (' + valori.length + ' giorni)\n';

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(testo).then(() => mostraToast('Riepilogo copiato ✓'));
  } else {
    const el = document.createElement('textarea');
    el.value = testo;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
    mostraToast('Riepilogo copiato ✓');
  }
}

// ── TOAST ─────────────────────────────────────────────────────────
let toastTimer = null;
function mostraToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ── START ─────────────────────────────────────────────────────────
init();
</script>
